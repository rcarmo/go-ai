name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly maintenance/security scan. This is independent from developer
    # candidate pushes; local-first release work still pushes only once at the end.
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  check:
    name: Vet, Staticcheck & Deterministic Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26.6']
    steps:
      - uses: actions/checkout@v4
      - name: Initialize project-owned temporary paths
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/go-ai"
          mkdir -p "$root/cache/go-build" "$root/cache/go-mod" "$root/cache/go-path" "$root/cache/xdg" "$root/cache/python" "$root/build/tmp"
          {
            echo "PROJECT_TMP_ROOT=$root"
            echo "GOCACHE=$root/cache/go-build"
            echo "GOMODCACHE=$root/cache/go-mod"
            echo "GOPATH=$root/cache/go-path"
            echo "XDG_CACHE_HOME=$root/cache/xdg"
            echo "PYTHONPYCACHEPREFIX=$root/cache/python"
            for name in TMPDIR TMP TEMP GOTMPDIR; do echo "$name=$root/build/tmp"; done
          } >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Download dependencies
        run: make deps

      - name: Build
        run: make build

      - name: Check (vet, staticcheck, deterministic tests)
        run: make check

      - name: Race tests
        run: make test-race

      - name: Test with coverage
        if: matrix.go-version == '1.26.6'
        run: make coverage

      - name: Logging quality gate
        run: ./scripts/check-logging.sh

      - name: Upload test analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-ai-test-profiles-${{ github.sha }}
          path: |
            ${{ runner.temp }}/go-ai/evidence/analysis/
          if-no-files-found: error
          retention-days: 14

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-ai-sbom-${{ github.sha }}
          path: |
            artifacts/sbom.cdx.json
            artifacts/sbom.cdx.json.sha256
          if-no-files-found: error
          retention-days: 30

  fuzz:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize project-owned temporary paths
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/go-ai"
          mkdir -p "$root/cache/go-build" "$root/cache/go-mod" "$root/cache/go-path" "$root/cache/xdg" "$root/cache/python" "$root/build/tmp"
          {
            echo "PROJECT_TMP_ROOT=$root"
            echo "GOCACHE=$root/cache/go-build"
            echo "GOMODCACHE=$root/cache/go-mod"
            echo "GOPATH=$root/cache/go-path"
            echo "XDG_CACHE_HOME=$root/cache/xdg"
            echo "PYTHONPYCACHEPREFIX=$root/cache/python"
            for name in TMPDIR TMP TEMP GOTMPDIR; do echo "$name=$root/build/tmp"; done
          } >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false

      - name: Fuzz - Partial JSON parser
        run: make fuzz PACKAGES=./internal/jsonparse FUZZ_TARGET=FuzzPartialJSON FUZZTIME=30s

      - name: Fuzz - SSE parser
        run: make fuzz PACKAGES=./transports/sse FUZZ_TARGET=FuzzSSEParse FUZZTIME=30s

      - name: Fuzz - Context round-trip
        run: make fuzz PACKAGES=./tests FUZZ_TARGET=FuzzContextRoundTrip FUZZTIME=30s

      - name: Fuzz - Message transformation
        run: make fuzz PACKAGES=./tests FUZZ_TARGET=FuzzTransformMessages FUZZTIME=30s

      - name: Fuzz - Overflow detection
        run: make fuzz PACKAGES=./tests FUZZ_TARGET=FuzzOverflowDetection FUZZTIME=30s

      - name: Upload fuzz analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-ai-fuzz-profiles-${{ github.sha }}
          path: ${{ runner.temp }}/go-ai/evidence/analysis/
          if-no-files-found: error
          retention-days: 14
