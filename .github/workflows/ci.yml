name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Vet, Staticcheck & Deterministic Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Check (vet, staticcheck, deterministic tests)
        run: make check GO_TMPDIR=/tmp

      - name: Race tests
        run: go test ./... -count=1 -race

      - name: Test with coverage
        if: matrix.go-version == '1.24.x'
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Logging quality gate
        run: ./scripts/check-logging.sh

      - name: Generate and validate SBOM/security artifacts
        run: make ci-artifacts GO_TMPDIR=/tmp

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-ai-sbom-${{ github.sha }}
          path: |
            artifacts/sbom.cdx.json
            artifacts/sbom.cdx.json.sha256
          if-no-files-found: error
          retention-days: 30

  fuzz:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Fuzz - Partial JSON parser
        run: go test -fuzz FuzzPartialJSON -fuzztime 30s ./internal/jsonparse/

      - name: Fuzz - SSE parser
        run: go test -fuzz FuzzSSEParse -fuzztime 30s ./transports/sse/

      - name: Fuzz - Context round-trip
        run: go test -fuzz FuzzContextRoundTrip -fuzztime 30s .

      - name: Fuzz - Message transformation
        run: go test -fuzz FuzzTransformMessages -fuzztime 30s .

      - name: Fuzz - Overflow detection
        run: go test -fuzz FuzzOverflowDetection -fuzztime 30s .
